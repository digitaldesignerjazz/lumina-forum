name = "lumina-forum"
main = "src/index.js"
compatibility_date = "2025-07-01"
account_id = "b396f8898878d236a36aaf70de04dea1"
workers_dev = true

# Static files (CSS, favicon). Matching files are served before the Worker runs.
[assets]
directory = "./public"
binding = "ASSETS"

[[kv_namespaces]]
binding = "STORE"
# PLACEHOLDER: local dev only (wrangler dev --local uses a local simulated KV).
# Replace with a real namespace id before any deploy.
id = "00000000000000000000000000000000"

[vars]
FORUM_NAME = "Lumina Forum"

[observability]
enabled = true
